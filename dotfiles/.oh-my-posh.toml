console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3

[transient_prompt]
  template = '{{if .Root}}⚡ {{end}}❯ '
  foreground = '#FFD700'
  background = 'transparent'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    foreground = '#fff'
    background = '#003543'
    type = 'os'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'
      windows = ''

  [[blocks.segments]]
    template = '{{ .UserName }} '
    foreground = '#d2ff5e'
    powerline_symbol = ''
    background = '#003543'
    type = 'session'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '  {{ .Path }} '
    foreground = '#003544'
    powerline_symbol = ''
    background = '#0087D8'
    type = 'path'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'
      folder_separator_icon = '/'
      style = 'unique'

  [[blocks.segments]]
    template = ' {{ .HEAD }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = '#193549'
    powerline_symbol = ''
    background = '#d2ff5e'
    type = 'git'
    style = 'powerline'
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}#ff9248{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}', '{{ if gt .Ahead 0 }}#89d1dc{{ end }}', '{{ if gt .Behind 0 }}#f17c37{{ end }}']

    [blocks.segments.properties]
      cache_duration = 'none'
      fetch_stash_count = true
      fetch_status = true

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = ' {{ if gt .Code 0 }}✗ {{ reason .Code }}{{ else }}✓{{ end }} '
    foreground = '#242424'
    powerline_symbol = ''
    background = '#33DD2D'
    type = 'status'
    style = 'powerline'
    background_templates = ['{{ if gt .Code 0 }}#f1184c{{ end }}']
    invert_powerline = true

    [blocks.segments.properties]
      always_enabled = true
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ .FormattedMs }} ⌛'
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#49404f'
    type = 'executiontime'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}  '
    foreground = '#242424'
    powerline_symbol = ''
    background = '#f36943'
    type = 'battery'
    style = 'powerline'
    background_templates = ['{{if eq "Charging" .State.String}}#33DD2D{{end}}', '{{if eq "Discharging" .State.String}}#FFCD58{{end}}', '{{if eq "Full" .State.String}}#0476d0{{end}}']
    invert_powerline = true

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '  {{ .Venv }} '
    foreground = '#003544'
    powerline_symbol = ''
    background = '#0087D8'
    type = 'python'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      fetch_virtual_env = true

  [[blocks.segments]]
    template = ' {{ .CurrentDate | date .Format }} <#fff></> '
    foreground = '#fff'
    background = '#003543'
    type = 'time'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' ⚡ '
    foreground = '#FFD700'
    type = 'root'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '❯ '
    foreground = '#FFD700'
    type = 'text'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
